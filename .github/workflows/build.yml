name: Firmware bauen und Installer veröffentlichen

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]   # reine Text-Änderungen brauchen keinen neuen Build
  workflow_dispatch:

permissions:
  contents: write   # für die Releases (Firmware-Dateien für Online-Updates und Downgrades)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ESP32_CORE: "3.0.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache für ESP32-Werkzeuge
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ env.ESP32_CORE }}

      - name: ESP32-Kern und Bibliotheken installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
          arduino-cli lib install "ArduinoJson@7.2.1" "PubSubClient@2.8" "Adafruit NeoPixel@1.12.3"

      - name: Zertifikate für Online-Updates prüfen
        run: python3 .github/scripts/check_certs.py

      - name: Firmware kompilieren
        run: |
          set -euo pipefail
          pip install --quiet esptool
          BASE=$(grep -oP 'FW_VERSION = "\K[0-9]+\.[0-9]+' firmware/trilumag/trilumag.ino)
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          sed -i "s/const char\* FW_VERSION = \"[^\"]*\";/const char* FW_VERSION = \"${VERSION}\";/" firmware/trilumag/trilumag.ino
          BOOT_APP0=$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -n1)

          build () {
            NAME="$1"; FQBN="$2"; CHIP="$3"; BOOT_OFFSET="$4"
            echo "::group::Baue ${NAME}"
            if ! arduino-cli compile --fqbn "$FQBN" --build-path "build/${NAME}" --warnings default firmware/trilumag > "compile-${NAME}.log" 2>&1; then
              # Fehler als Anmerkungen ausgeben, damit sie auch ohne Log sichtbar sind
              grep -E "error|Error" "compile-${NAME}.log" | head -n 15 | while IFS= read -r l; do echo "::error::${NAME}: ${l}"; done
              cat "compile-${NAME}.log"; exit 1
            fi
            cat "compile-${NAME}.log"
            mkdir -p "site/firmware/${NAME}"
            if [ -f "build/${NAME}/trilumag.ino.merged.bin" ]; then
              cp "build/${NAME}/trilumag.ino.merged.bin" "site/firmware/${NAME}/trilumag.bin"
            else
              python -m esptool --chip "$CHIP" merge_bin -o "site/firmware/${NAME}/trilumag.bin" \
                "$BOOT_OFFSET" "build/${NAME}/trilumag.ino.bootloader.bin" \
                0x8000 "build/${NAME}/trilumag.ino.partitions.bin" \
                0xe000 "$BOOT_APP0" \
                0x10000 "build/${NAME}/trilumag.ino.bin"
            fi
            # Einzelteile für den Webinstaller: so bleibt der NVS-Bereich (WLAN, Einstellungen, Presets) bei Updates erhalten
            cp "build/${NAME}/trilumag.ino.bootloader.bin" "site/firmware/${NAME}/bootloader.bin"
            cp "build/${NAME}/trilumag.ino.partitions.bin" "site/firmware/${NAME}/partitions.bin"
            cp "$BOOT_APP0" "site/firmware/${NAME}/boot_app0.bin"
            cp "build/${NAME}/trilumag.ino.bin" "site/firmware/${NAME}/app.bin"
            ls -l "site/firmware/${NAME}"
            echo "::endgroup::"
          }

          build esp32   "esp32:esp32:esp32:PartitionScheme=min_spiffs"                    esp32   0x1000
          build esp32s3 "esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=min_spiffs"    esp32s3 0x0
          build esp32c3 "esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs"    esp32c3 0x0
          build esp32c6 "esp32:esp32:esp32c6:CDCOnBoot=cdc,PartitionScheme=min_spiffs"    esp32c6 0x0

          cp installer/* site/
          sed -i "s/__VERSION__/${VERSION}/g" site/manifest.json site/index.html
          touch site/.nojekyll
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Release für Online-Updates anlegen
        if: github.ref == 'refs/heads/main'      # Probe-Builds anderer Zweige veröffentlichen nichts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          for n in esp32 esp32s3 esp32c3 esp32c6; do cp "site/firmware/$n/app.bin" "release/trilumag-$n.bin"; done
          # Text zur Version aus dem Versionsverlauf (Abschnitt "## <Version>"), sonst ein kurzer Standardtext
          awk -v v="## ${VERSION}" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Automatischer Build ${VERSION}. Details im Versionsverlauf (CHANGELOG.md)." > notes.md
          gh release create "v${VERSION}" release/*.bin --title "Trilumag ${VERSION}" --notes-file notes.md --target "${GITHUB_SHA}"
          # Versionsliste für die Geräte: neueste zuerst, höchstens 20
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" > releases.json
          python3 - <<'PY'
          import json,re
          rs=json.load(open('releases.json'))
          out=[]
          for r in rs:
            if r.get('draft') or not r['tag_name'].startswith('v'): continue
            names={a['name'] for a in r.get('assets',[])}
            if 'trilumag-esp32s3.bin' not in names: continue
            body=(r.get('body') or '').replace('\r','')
            first=next((re.sub(r'[*_`#>-]+\s*','',l).strip() for l in body.split('\n') if l.strip() and not l.startswith('#')),'')
            out.append({'v':r['tag_name'][1:],'date':(r.get('published_at') or '')[:10],'notes':first[:110]})
          def key(x): return [int(p) for p in re.findall(r'\d+',x['v'])]
          out.sort(key=key,reverse=True)
          json.dump({'latest':out[0]['v'] if out else '','versions':out[:20]},open('site/versions.json','w'),ensure_ascii=False)
          print(open('site/versions.json').read())
          PY

      - name: Panel-Firmware (CH32V003) bauen
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          git clone -q --depth 1 https://github.com/cnlohr/ch32fun.git ch32fun
          make -C firmware/panel build CH32FUN="$PWD/ch32fun/ch32fun" NEWLIB=/usr/lib/picolibc/riscv64-unknown-elf/include
          mkdir -p site/firmware/panel
          cp firmware/panel/panel.bin firmware/panel/panel.hex site/firmware/panel/
          ls -l site/firmware/panel

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
