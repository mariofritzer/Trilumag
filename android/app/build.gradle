plugins { id 'com.android.application' }

// Eigene App-Version (unabhängig von der Firmware): nur erhöhen, wenn sich an der App etwas ändert.
// Steht in version.txt, z. B. 1.0 oder 1.2.1; versionCode = Haupt*10000 + Neben*100 + Patch
def vName = file('version.txt').text.trim()
def vParts = (vName.tokenize('.').collect { it as int } + [0, 0, 0]).take(3)
def vCode = vParts[0] * 10000 + vParts[1] * 100 + vParts[2]

android {
    namespace 'at.trilumag.app'
    compileSdk 34
    defaultConfig {
        applicationId 'at.trilumag.app'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
    }
    signingConfigs {
        // fester Schlüssel im Repo, damit sich neue Versionen über die alte installieren lassen
        release {
            storeFile file('../trilumag.jks')
            storePassword 'trilumag-app'
            keyAlias 'trilumag'
            keyPassword 'trilumag-app'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
